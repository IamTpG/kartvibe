<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard đơn hàng</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-client="web">
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">API COMPOSITION</p>
        <h1>Dashboard đơn hàng</h1>
        <p class="intro">Cùng dữ liệu, ba đường đi từ trình duyệt đến dịch vụ.</p>
      </div>
      <a class="switch-page" href="/mobile.html">Xem bản mobile →</a>
    </header>

    <section class="controls" aria-label="Điều khiển">
      <label>Chế độ
        <select id="mode">
          <option value="baseline">Baseline REST</option>
          <option value="bff">BFF</option>
          <option value="graphql-naive">GraphQL (N+1: DataLoader tắt)</option>
          <option value="graphql-fixed">GraphQL (đã sửa: DataLoader bật)</option>
        </select>
      </label>
      <label>User ID <input id="user-id" type="number" min="1" step="1" value="1"></label>
      <button id="load">Tải dữ liệu</button>
    </section>

    <section class="metrics" aria-label="Chỉ số">
      <div><span>Request client</span><strong id="requests">—</strong></div>
      <div><span>Payload nhận</span><strong id="bytes">—</strong></div>
      <div><span>Màn hình hoàn tất</span><strong id="duration">—</strong></div>
      <div><span>Trạng thái</span><strong id="state">Chưa tải</strong></div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
    <section id="content" aria-live="polite"></section>
  </main>

  <script src="/measure/measure-client.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/demo.js"></script>
  <script type="module" src="/measure/runner.js"></script>
</body>
</html>
